<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My Foreign Friend</title>
<style>
:root{--cream:#fff8e7;--card:#fffdf7;--ink:#2f2a24;--muted:#6e6256;--line:#eadcc0;--trav:#ffe89a;--expl:#bdeedd;--guide:#c7e7ff;--me:#fff0ad;--accent:#98711f;--warn:#fff0f0;--ok:#eafff5}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,'Apple SD Gothic Neo','Nanum Gothic',sans-serif;background:linear-gradient(180deg,#fffaf0,#fff2bf);color:var(--ink)}button,input{font:inherit}.wrap{max-width:920px;margin:0 auto;padding:16px 12px 20px}.top{background:rgba(255,253,247,.96);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:0 12px 26px rgba(120,86,18,.10)}h1{font-size:clamp(32px,8vw,56px);line-height:1;margin:0 0 8px;letter-spacing:-.04em}.sub{margin:0;color:var(--muted);font-size:16px}.privacy{margin-top:12px;font-size:13px;line-height:1.55;color:#5b5147;background:#fff7e9;border:1px dashed #d7c49e;border-radius:14px;padding:10px 12px}.select{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.modeBtn{appearance:none;border:0;border-radius:24px;min-height:108px;padding:20px 10px;font-size:24px;font-weight:900;color:#352d25;box-shadow:0 8px 0 rgba(62,46,18,.16);cursor:pointer;touch-action:manipulation}.modeBtn:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(62,46,18,.16)}.trav{background:var(--trav)}.expl{background:var(--expl)}.guide{background:var(--guide)}.chatPanel{display:none;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 12px 26px rgba(120,86,18,.10)}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:#fffaf0;border-bottom:1px solid var(--line)}.badge{font-weight:900;border-radius:999px;padding:8px 14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.miniBtn{border:1px solid #d4c19d;background:#fff;border-radius:999px;padding:9px 13px;font-weight:800;color:#3a3128;cursor:pointer;touch-action:manipulation}.chat{height:min(58vh,560px);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}.msg{max-width:84%;padding:12px 14px;border-radius:18px;line-height:1.48;white-space:pre-wrap;word-break:break-word;font-size:16px}.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:6px}.warn{background:var(--warn);border-color:#efc2c2}.sys{background:var(--ok);border-color:#bae8d1}.inputBox{display:flex;gap:8px;padding:12px;background:#fffaf0;border-top:1px solid var(--line)}.inputBox input{flex:1;min-width:0;border:1px solid #d5c3a2;border-radius:20px;padding:13px 14px;font-size:16px;background:#fff}.send{border:0;border-radius:20px;background:var(--accent);color:white;font-weight:900;padding:0 18px;cursor:pointer;touch-action:manipulation}.send:disabled{opacity:.55}.report{display:none;margin-top:14px;background:#fffdf7;border:1px solid var(--line);border-radius:22px;padding:16px}.report h2{margin:0 0 10px}.report pre{white-space:pre-wrap;background:#fff8e8;border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.5;font-family:inherit;font-size:14px}.toast{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#332b22;color:#fff;padding:10px 14px;border-radius:999px;font-size:14px}@media(max-width:650px){.wrap{padding:0}.top{border-radius:0 0 24px 24px;border-left:0;border-right:0}.select{grid-template-columns:1fr}.modeBtn{min-height:82px}.chatPanel{margin-top:0;border-radius:0;border-left:0;border-right:0}.chat{height:calc(100dvh - 174px);padding:14px}.msg{max-width:94%;font-size:16px}.inputBox{position:sticky;bottom:0}.send{padding:0 16px}}
</style>
</head>
<body>
<div class="wrap"><section class="top" id="home"><h1>My Foreign Friend</h1><p class="sub">선생님이 알려준 AI 도움 방식을 선택하세요.</p><div class="privacy">개인정보 보호 안내: 실제 이름, 집 주소, 전화번호, 이메일, 학교 밖 연락처, 얼굴 사진 등 개인정보는 입력하지 마세요. 이름은 영어 이름이나 별명을 사용해도 됩니다. 이 챗봇은 공모전 시연 및 영어 수업 연습용입니다.</div><div class="select"><button class="modeBtn trav" data-mode="traveler" type="button">Traveler</button><button class="modeBtn expl" data-mode="explorer" type="button">Explorer</button><button class="modeBtn guide" data-mode="guide" type="button">Guide</button></div></section><section class="chatPanel" id="chatPanel"><div class="bar"><span class="badge" id="modeBadge">Traveler</span><div class="actions"><button class="miniBtn" id="homeBtn" type="button">처음으로</button><button class="miniBtn" id="clearBtn" type="button">대화 지우기</button></div></div><div class="chat" id="chat"></div><div class="inputBox"><input id="userInput" placeholder="Type here..." autocomplete="off"/><button class="send" id="sendBtn" type="button">Send</button></div></section><section class="report" id="reportBox"><h2>대화 결과 보고서</h2><pre id="reportText"></pre><div class="actions"><button class="miniBtn" id="copyBtn" type="button">보고서 복사</button><button class="miniBtn" id="downBtn" type="button">TXT 다운로드</button></div></section></div><div class="toast" id="toast">복사했어!</div>
<script>
'use strict';
const MODES={traveler:{label:'Traveler',friend:'Alex',country:'the U.S.',cls:'trav'},explorer:{label:'Explorer',friend:'Mia',country:'Australia',cls:'expl'},guide:{label:'Guide',friend:'Liam',country:'Canada',cls:'guide'}};
const $=id=>document.getElementById(id); const chat=$('chat'), input=$('userInput'), sendBtn=$('sendBtn');
let mode='traveler', messages=[], goals={name:false,spell:false,country:false,like:false,can:false,visit:false,askedName:false,askedSpell:false,askedCountry:false}, reportText='';
const bad=['씨발','시발','ㅅㅂ','병신','ㅂㅅ','꺼져','죽어','멍청','바보','shut up','stupid','idiot','fuck'];
const answerReq=['답 써줘','대신 써','글 써줘','영어글 써줘','그냥 만들어','정답 알려','write it for me','make my writing','give me the answer'];
const reportWords=['결과 보고서 작성해줘','결과 보고서','보고서 작성','보고서','report','make report'];
function norm(t){return (t||'').toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').trim()} function hasAny(t,a){const n=norm(t);return a.some(w=>n.includes(w))} function isPrivate(t){return /\d{3}[- ]?\d{3,4}[- ]?\d{4}/.test(t)||t.includes('@')||hasAny(t,['주소','우리집','아파트','전화번호','핸드폰','휴대폰','카톡','인스타']);}
function say(text,kind='bot',warn=false){const d=document.createElement('div');d.className='msg '+(kind==='me'?'me':'bot')+(warn?' warn':'');d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function startMode(m){mode=m;messages=[];goals={name:false,spell:false,country:false,like:false,can:false,visit:false,askedName:false,askedSpell:false,askedCountry:false};$('home').style.display='none';$('chatPanel').style.display='block';$('reportBox').style.display='none';const b=$('modeBadge');b.textContent=MODES[m].label;b.className='badge '+MODES[m].cls;chat.innerHTML='';const intro=`Hi! I’m ${MODES[m].friend} from ${MODES[m].country}.\nI’m your foreign friend. Let’s talk!`;say(intro);messages.push({role:'model',content:intro});setTimeout(()=>input.focus(),200)}
function updateGoals(t){const n=norm(t); if(n.includes('my name is'))goals.name=true; if(/[a-z]-[a-z]/i.test(t)||n.includes('spell'))goals.spell=true; if(n.includes("i'm from")||n.includes('i am from'))goals.country=true; if(n.includes('i like'))goals.like=true; if(n.includes('i can'))goals.can=true; if(n.includes('want to visit'))goals.visit=true; if(n.includes("what's your name")||n.includes('what is your name'))goals.askedName=true; if(n.includes('how do you spell'))goals.askedSpell=true; if(n.includes('where are you from'))goals.askedCountry=true;}
async function send(){const text=input.value.trim(); if(!text)return; input.value=''; say(text,'me'); if(isPrivate(text)){say('개인정보는 입력하지 마. 이름은 별명이나 영어 이름을 사용해도 돼.', 'bot', true);return} if(hasAny(text,bad)){say('고운 말을 사용해 보자. 이 챗봇은 영어 여행 글쓰기 연습을 위한 친구야.', 'bot', true);return} if(hasAny(text,answerReq)){say('I can’t write everything for you. But I can help you with words and sentence frames.', 'bot', true);return} updateGoals(text); messages.push({role:'user',content:text}); if(hasAny(text,reportWords)){await makeReport();return} await callAI(false);}
async function callAI(wantsReport){sendBtn.disabled=true; say('...', 'bot', false); const loading=chat.lastChild; try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,friend:MODES[mode],messages,goals,wantsReport})}); const data=await res.json(); loading.remove(); if(!res.ok) throw new Error(data.error||'API error'); const reply=data.reply||'Sorry, try again!'; if(wantsReport){showReport(reply); messages.push({role:'model',content:'Report generated.'});} else {say(reply); messages.push({role:'model',content:reply});}}
catch(e){loading.remove(); say('지금 AI 연결이 잘 안 돼. Vercel 환경변수 GEMINI_API_KEY를 확인해줘.', 'bot', true); console.error(e)} finally{sendBtn.disabled=false; input.focus();}}
async function makeReport(){await callAI(true)}
function showReport(t){reportText=t; $('reportText').textContent=t; $('reportBox').style.display='block'; $('reportBox').scrollIntoView({behavior:'smooth'}); say('Here is your report! Copy it and use it with Wrtn.','bot')}
function copyReport(){navigator.clipboard.writeText(reportText||$('reportText').textContent).then(()=>toast('복사했어!'))} function downloadReport(){const blob=new Blob([reportText||$('reportText').textContent],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my_foreign_friend_report.txt';a.click();URL.revokeObjectURL(a.href)} function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1400)}
function bindTap(el,fn){el.addEventListener('click',fn);el.addEventListener('touchstart',e=>{e.preventDefault();fn(e)},{passive:false})}
document.querySelectorAll('.modeBtn').forEach(btn=>bindTap(btn,()=>startMode(btn.dataset.mode)));bindTap(sendBtn,send);$('userInput').addEventListener('keydown',e=>{if(e.key==='Enter')send()});bindTap($('homeBtn'),()=>{$('home').style.display='block';$('chatPanel').style.display='none';$('reportBox').style.display='none'});bindTap($('clearBtn'),()=>startMode(mode));bindTap($('copyBtn'),copyReport);bindTap($('downBtn'),downloadReport);
</script>
</body>
</html>
